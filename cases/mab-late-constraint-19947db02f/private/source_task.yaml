{
  "instruction": "\n            Welcome to our negotiation scenario for the \"One Happy Camper High Chair Banner\", a perfect addition to any little boy's camping-themed first birthday celebration. Priced at $14.99 with a stellar rating of 4.8/5 stars, this decoration piece promises both quality and affordability.\n\nBuyers are looking for the best deal possible, prioritizing a balance between price and quality. On the other hand, sellers are focused on justifying the premium pricing for this carefully crafted and well-reviewed product.\n\nAs we navigate this negotiation, both parties will need to find common ground to reach a mutually beneficial agreement. Let's dive in and explore the possibilities of creating a memorable and charming birthday celebration for your little one.\n            The agents are encouraged to actively use the tools provided, such as offering a price, rejecting and countering offers, providing information, or ending the negotiation, to achieve their respective goals.\n            The simulation should focus on effective tool usage to simulate a realistic bargaining process.\n            "
