format_version: 2
case_id: gaia2-stockholm-moveout
classification:
  primary_event_theme: task_scope_or_dependency_change
  secondary_event_themes:
  - delayed_authoritative_result
  async_scenario_class: live_eventful
capabilities:
- late_revision_adoption
- selective_invalidation
- verification_reopen
workstream_bindings:
  app_state_reader_A:
    result_kind: result_01
    validator_command: python3 -c "import base64,hashlib,json,os; p='/app/task_file/app/raf_saved_list.json'; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; assert os.path.isfile(p); d=json.load(open(p,encoding='utf-8')); assert int(e['listing_count'])==len(d['saved']); assert e['saved_list_revision']==hashlib.sha256(open(p,'rb').read()).hexdigest()"
    validator_timeout_sec: 120
    private_evidence_schema:
      saved_list_path:
        type: string
      listing_count:
        type: integer
      saved_list_revision:
        type: string
        pattern: '[0-9a-f]{64}'
    event_assets: []
    validator_stage: semantic_evidence
  app_state_reader_B:
    result_kind: result_02
    validator_command: python3 -c "import base64,hashlib,json,os; p='/app/task_file/app/raf_catalog.json'; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; assert os.path.isfile(p); d=json.load(open(p,encoding='utf-8')); assert int(e['catalog_count'])==len(d['catalog']); assert e['inventory_revision']==hashlib.sha256(open(p,'rb').read()).hexdigest()"
    validator_timeout_sec: 120
    private_evidence_schema:
      catalog_path:
        type: string
      catalog_count:
        type: integer
      inventory_revision:
        type: string
        pattern: '[0-9a-f]{64}'
    event_assets: []
    validator_stage: semantic_evidence
  contact_budget_reader:
    result_kind: result_03
    validator_command: python3 -c "import base64,json,os; p='/app/task_file/app/contacts.json'; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; assert os.path.isfile(p); d=json.load(open(p,encoding='utf-8')); c=[x for x in d['contacts'] if x['id']==e['contact_id']]; assert c and int(e['budget_sek'])==int(c[0]['budget_sek'])"
    validator_timeout_sec: 120
    private_evidence_schema:
      contact_path:
        type: string
      contact_id:
        type: string
      budget_sek:
        type: integer
    event_assets: []
    validator_stage: semantic_evidence
  event_monitor:
    result_kind: result_04
    validator_command: python3 -c "import base64,hashlib,json,os; p='/app/task_file/event_feed/feed.jsonl'; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; assert os.path.isfile(p); rows=[l for l in open(p,encoding='utf-8') if l.strip()]; assert int(e['events_seen'])>=1; assert 1<=int(e['stream_sequence'])<=max(json.loads(l)['seq'] for l in rows); assert e['stream_revision']==hashlib.sha256(open(p,'rb').read()).hexdigest()"
    validator_timeout_sec: 120
    private_evidence_schema:
      feed_path:
        type: string
      stream_revision:
        type: string
        pattern: '[0-9a-f]{64}'
      stream_sequence:
        type: integer
      events_seen:
        type: integer
    event_assets:
    - /app/task_file/event_feed/feed.jsonl
    - /app/task_file/event_feed/feed_meta.json
    validator_stage: semantic_evidence
  action_planner:
    result_kind: result_05
    validator_command: python3 -c "import base64,hashlib,json,os; p='/app/output_data/planned_ops.json'; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; assert os.path.isfile(p); d=json.load(open(p,encoding='utf-8')); assert int(e['ops_count'])>=1; assert e['plan_revision']==hashlib.sha256(open(p,'rb').read()).hexdigest()"
    validator_timeout_sec: 120
    private_evidence_schema:
      plan_path:
        type: string
      plan_revision:
        type: string
        pattern: '[0-9a-f]{64}'
      ops_count:
        type: integer
    event_assets: []
    validator_stage: semantic_evidence
  world_state_validator:
    result_kind: result_06
    validator_command: python3 -c "import base64,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; p='/app/output_data/saved_list_final.json'; n='/app/output_data/notifications.jsonl'; assert e['verification_passed'] in (True,False); assert isinstance(e['notifications_count'],int) and e['notifications_count']>=0; assert len(e['final_revision'])==64; assert not e['verification_passed'] or (os.path.isfile(p) and os.path.isfile(n))"
    validator_timeout_sec: 120
    private_evidence_schema:
      verification_passed:
        type: boolean
      final_revision:
        type: string
        pattern: '[0-9a-f]{64}'
      notifications_count:
        type: integer
    event_assets: []
    validator_stage: semantic_evidence
result_contract:
  allowed_result_kinds:
  - result_01
  - result_02
  - result_03
  - result_04
  - result_05
  - result_06
  rule: At child spawn assign semantic work_units; at completion tag the result with the matching kind. The gateway, not the main agent, receives completion first.
authoritative_result_kind: result_04
superseded_result_kind: result_05
scenarios:
  linear:
    events: []
  async:
    events:
    - id: c1_a_vasa
      at: 2
      result: result_04
      invalidates_artifacts:
      - planned_saved_list_ops
      - saved_list_artifact
      reopens_milestones:
      - finalize_saved_list
      - send_notification
    - id: c1_a_budget
      at: 3
      result: result_03
      invalidates_artifacts: []
      reopens_milestones: []
artifact_observers: {}
hidden_checks:
  saved_list_closure: 'python3 -c "import json; a=json.load(open(''/app/task_file/app/raf_saved_list.json'',encoding=''utf-8'')); prefs=a[''search_preferences'']; saved=a[''saved'']; cat=json.load(open(''/app/task_file/app/raf_catalog.json'',encoding=''utf-8''))[''catalog'']; feed=[json.loads(l) for l in open(''/app/task_file/event_feed/feed.jsonl'',encoding=''utf-8'') if l.strip()]; ok=lambda c,p: c==prefs[''city''] and prefs[''min_rent_sek'']<=p<=prefs[''max_rent_sek'']; exp={e[''id''] for e in saved if not (e[''city'']==prefs[''city''] and not ok(e[''city''],e[''price_sek'']))}; ids={e[''id''] for e in saved}; exp|={e[''id''] for e in cat if ok(e[''city''],e[''price_sek'']) and e[''id''] not in ids}; exp|={e[''listing''][''id''] for e in feed if ok(e[''listing''][''city''],e[''listing''][''price_sek''])}; fin={e[''id''] for e in json.load(open(''/app/output_data/saved_list_final.json'',encoding=''utf-8''))[''saved'']}; assert fin==exp"'
  notification_closure: python3 -c "import json; prefs=json.load(open('/app/task_file/app/raf_saved_list.json',encoding='utf-8'))['search_preferences']; feed=[json.loads(l) for l in open('/app/task_file/event_feed/feed.jsonl',encoding='utf-8') if l.strip()]; feed.sort(key=lambda e:e['seq']); exp=[e['listing']['id'] for e in feed if e['listing']['city']==prefs['city'] and prefs['min_rent_sek']<=e['listing']['price_sek']<=prefs['max_rent_sek']]; got=[json.loads(l)['listing_id'] for l in open('/app/output_data/notifications.jsonl',encoding='utf-8') if l.strip()]; assert got==exp"
  no_stale_in_final: python3 -c "import json; prefs=json.load(open('/app/task_file/app/raf_saved_list.json',encoding='utf-8'))['search_preferences']; fin={e['id'] for e in json.load(open('/app/output_data/saved_list_final.json',encoding='utf-8'))['saved']}; feed=[json.loads(l) for l in open('/app/task_file/event_feed/feed.jsonl',encoding='utf-8') if l.strip()]; decoys=[e['listing']['id'] for e in feed if not (e['listing']['city']==prefs['city'] and prefs['min_rent_sek']<=e['listing']['price_sek']<=prefs['max_rent_sek'])]; assert not (set(decoys)&fin)"
reverification_anchors:
  saved_list_closure:
  - result_04
  notification_closure:
  - result_04
  no_stale_in_final:
  - result_04
stale_predicate:
  type: revision_mismatch
  authoritative_fields:
  - stream_revision
  superseded_fields:
  - plan_revision
stale_revalidation:
  candidate_checks:
  - saved_list_closure
  - notification_closure
  artifact_checks:
    saved_list_artifact:
    - saved_list_closure
    notification_artifact:
    - notification_closure
information_sufficiency:
- workstream_id: app_state_reader_A
  public_inputs:
  - /app/task_file/app/raf_saved_list.json
  required_output_fields:
  - saved_list_path
  - listing_count
  - saved_list_revision
  review_status: reviewed
  requirement_ids:
  - gaia2_stockholm_async_closure
- workstream_id: app_state_reader_B
  public_inputs:
  - /app/task_file/app/raf_catalog.json
  required_output_fields:
  - catalog_path
  - catalog_count
  - inventory_revision
  review_status: reviewed
  requirement_ids:
  - gaia2_stockholm_async_closure
- workstream_id: contact_budget_reader
  public_inputs:
  - /app/task_file/app/contacts.json
  required_output_fields:
  - contact_path
  - contact_id
  - budget_sek
  review_status: reviewed
  requirement_ids:
  - gaia2_stockholm_async_closure
- workstream_id: event_monitor
  public_inputs:
  - /app/task_file/event_feed/feed.jsonl
  - /app/task_file/event_feed/feed_meta.json
  required_output_fields:
  - feed_path
  - stream_revision
  - stream_sequence
  - events_seen
  review_status: reviewed
  requirement_ids:
  - gaia2_stockholm_async_closure
- workstream_id: action_planner
  public_inputs:
  - /app/output_data/planned_ops.json
  required_output_fields:
  - plan_path
  - plan_revision
  - ops_count
  review_status: reviewed
  requirement_ids:
  - gaia2_stockholm_async_closure
- workstream_id: world_state_validator
  public_inputs:
  - /app/output_data/saved_list_final.json
  - /app/output_data/notifications.jsonl
  required_output_fields:
  - verification_passed
  - final_revision
  - notifications_count
  review_status: reviewed
  requirement_ids:
  - gaia2_stockholm_async_closure
legacy_metadata:
  metrics:
    primary:
    - test_point_pass_rate
    - scenario_construction_rate
    - parallel_effect
    - replanning_drop
    - signed_task_order_effect
    diagnostics:
    - stale_retention_rate
    - recovery_latency
    - obsolete_work_ratio
    - reverification_completeness
    - token_consumption
  implementation: structure-derived
  upstream_commit: 78ea3bdbdeec2bdcd6afa542091
  asset_copies: []
