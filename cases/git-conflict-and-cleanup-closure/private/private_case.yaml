format_version: 2
case_id: git-conflict-and-cleanup-closure
classification:
  primary_event_theme: conflicting_valid_results
  secondary_event_themes:
  - delayed_authoritative_result
  async_scenario_class: result_eventful
capabilities:
- conflict_arbitration
- failure_redelegation
- verification_reopen
workstream_bindings:
  ref_history_scanner:
    result_kind: result_01
    validator_command: "python3 -c \"import base64,json,os,pathlib,sys\nev=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']\nreq='/app/output_data/scan_reports/ref_history.json'\nfields=['scan_revision']\nif ev.get('report_path')!=req:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_path_not_required_file');sys.exit(1)\nroot=pathlib.Path(os.environ.get('ASYNC_RBENCH_RESULT_WORKSPACE_ROOT') or '/')\np=root.joinpath(*[part for part in req.split('/') if part])\nif not p.is_file():\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_file_missing');sys.exit(1)\nif p.is_file():\n try:\n  r=json.load(open(p))\n except Exception:\n  print('ASYNC_RBENCH_CONTRACT_FAIL:report_json_invalid');sys.exit(1)\nelse:\n r={}\nif 'scan_revision' not in r:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_missing_required_field:scan_revision');sys.exit(1)\nif r['scan_revision']!=ev['scan_revision']:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_payload_field_mismatch:scan_revision');sys.exit(1)\""
    validator_timeout_sec: 120
    private_evidence_schema:
      found:
        type: boolean
      scanned_refs:
        type: array
      scan_revision:
        type: string
        pattern: '[0-9a-f]{40}'
      report_path:
        type: string
    event_assets: []
    validator_stage: submission_contract
  pack_scanner:
    result_kind: result_02
    validator_command: "python3 -c \"import base64,json,os,pathlib,sys\nev=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']\nreq='/app/output_data/scan_reports/pack.json'\nfields=['scan_revision', 'objects_scanned']\nif ev.get('report_path')!=req:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_path_not_required_file');sys.exit(1)\nroot=pathlib.Path(os.environ.get('ASYNC_RBENCH_RESULT_WORKSPACE_ROOT') or '/')\np=root.joinpath(*[part for part in req.split('/') if part])\nif not p.is_file():\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_file_missing');sys.exit(1)\nif p.is_file():\n try:\n  r=json.load(open(p))\n except Exception:\n  print('ASYNC_RBENCH_CONTRACT_FAIL:report_json_invalid');sys.exit(1)\nelse:\n r={}\nif 'scan_revision' not in r:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_missing_required_field:scan_revision');sys.exit(1)\nif r['scan_revision']!=ev['scan_revision']:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_payload_field_mismatch:scan_revision');sys.exit(1)\n\
      if 'objects_scanned' not in r:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_missing_required_field:objects_scanned');sys.exit(1)\nif r['objects_scanned']!=ev['objects_scanned']:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_payload_field_mismatch:objects_scanned');sys.exit(1)\""
    validator_timeout_sec: 120
    private_evidence_schema:
      found:
        type: boolean
      objects_scanned:
        type: integer
      scan_revision:
        type: string
        pattern: '[0-9a-f]{40}'
      report_path:
        type: string
    event_assets: []
    validator_stage: submission_contract
  object_database_scanner:
    result_kind: result_03
    validator_command: "python3 -c \"import base64,json,os,pathlib,sys\nev=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']\nreq='/app/output_data/scan_reports/object_db.json'\nfields=['object_id', 'secret_hash']\nif ev.get('report_path')!=req:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_path_not_required_file');sys.exit(1)\nroot=pathlib.Path(os.environ.get('ASYNC_RBENCH_RESULT_WORKSPACE_ROOT') or '/')\np=root.joinpath(*[part for part in req.split('/') if part])\nif not p.is_file():\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_file_missing');sys.exit(1)\nif p.is_file():\n try:\n  r=json.load(open(p))\n except Exception:\n  print('ASYNC_RBENCH_CONTRACT_FAIL:report_json_invalid');sys.exit(1)\nelse:\n r={}\nif 'object_id' not in r:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_missing_required_field:object_id');sys.exit(1)\nif r['object_id']!=ev['object_id']:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_payload_field_mismatch:object_id');sys.exit(1)\nif 'secret_hash'\
      \ not in r:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_missing_required_field:secret_hash');sys.exit(1)\nif r['secret_hash']!=ev['secret_hash']:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_payload_field_mismatch:secret_hash');sys.exit(1)\""
    validator_timeout_sec: 120
    private_evidence_schema:
      found:
        type: boolean
        enum:
        - true
      object_id:
        type: string
      secret_hash:
        type: string
        pattern: '[0-9a-f]{64}'
      scan_revision:
        type: string
        pattern: '[0-9a-f]{40}'
      report_path:
        type: string
      source_receipt:
        type: string
        pattern: gc-object-authority-[0-9a-f]{16}
    event_assets:
    - /app/task_file/events/object_authority.json
    validator_stage: submission_contract
  secret_recovery:
    result_kind: result_04
    validator_command: python3 -c "import base64,hashlib,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; assert os.path.isfile(e['secret_path']); r=json.load(open(e['report_path'],encoding='utf-8')); assert r['source_scan']=='object_db'; assert r['source_scan']==e['source_scan']; assert hashlib.sha256(open(e['secret_path'],'rb').read().strip()).hexdigest()==e['secret_sha256']"
    validator_timeout_sec: 120
    private_evidence_schema:
      source_scan:
        type: string
        enum:
        - object_db
      secret_sha256:
        type: string
        pattern: '[0-9a-f]{64}'
      secret_path:
        type: string
      report_path:
        type: string
    event_assets: []
    validator_stage: semantic_evidence
  cleanup_worker:
    result_kind: result_05
    validator_command: "python3 -c \"import base64,json,os,pathlib,sys\nev=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']\nreq='/app/output_data/cleanup_reports/1.json'\nfields=['attempt', 'command']\nif ev.get('report_path')!=req:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_path_not_required_file');sys.exit(1)\nroot=pathlib.Path(os.environ.get('ASYNC_RBENCH_RESULT_WORKSPACE_ROOT') or '/')\np=root.joinpath(*[part for part in req.split('/') if part])\nif not p.is_file():\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_file_missing');sys.exit(1)\nif p.is_file():\n try:\n  r=json.load(open(p))\n except Exception:\n  print('ASYNC_RBENCH_CONTRACT_FAIL:report_json_invalid');sys.exit(1)\nelse:\n r={}\nif 'attempt' not in r:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_missing_required_field:attempt');sys.exit(1)\nif r['attempt']!=ev['attempt']:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_payload_field_mismatch:attempt');sys.exit(1)\nif 'command' not in r:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_missing_required_field:command');sys.exit(1)\n\
      if r['command']!=ev['command']:\n print('ASYNC_RBENCH_CONTRACT_FAIL:report_payload_field_mismatch:command');sys.exit(1)\""
    validator_timeout_sec: 120
    private_evidence_schema:
      attempt:
        type: integer
      command:
        type: string
      report_path:
        type: string
    event_assets: []
    validator_stage: submission_contract
  cleanup_verifier:
    result_kind: result_06
    validator_command: python3 -c "import base64,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence']; assert os.path.isfile(e['report_path']); r=json.load(open(e['report_path'],encoding='utf-8')); assert bool(r['closed'])==bool(e['closed'])"
    validator_timeout_sec: 120
    private_evidence_schema:
      closed:
        type: boolean
      report_path:
        type: string
    event_assets: []
    validator_stage: semantic_evidence
result_contract:
  allowed_result_kinds:
  - result_01
  - result_02
  - result_03
  - result_04
  - result_05
  - result_06
  rule: At child spawn assign semantic work_units; at completion tag the result with the matching kind. The gateway, not the main agent, receives completion first.
authoritative_result_kind: result_03
superseded_result_kind: result_01
scenarios:
  linear:
    events: []
  async:
    events:
    - id: gc_a_neg
      at: 2
      result: result_01
      invalidates_artifacts: []
      reopens_milestones: []
    - id: gc_a_authority
      at: 4
      result: result_03
      invalidates_artifacts:
      - recovery_report
      - recovered_secret
      reopens_milestones:
      - secret_recovery
    - id: gc_a_verifier
      at: 6
      result: result_06
      invalidates_artifacts:
      - cleanup_report
      reopens_milestones:
      - cleanup_run
artifact_observers: {}
hidden_checks:
  authority_recovery: python3 -c "import hashlib,json,os; m=json.load(open('/app/output_data/decision_manifest.json',encoding='utf-8')); a=json.load(open('/app/output_data/scan_reports/object_db.json',encoding='utf-8')); assert m['recovery_source']=='object_db'; assert m['authority_object_id']==a['object_id']; assert m['recovered_secret_sha256']==a['secret_hash']"
  repo_closure: python3 -c "import json; c=json.load(open('/app/output_data/closure_report.json',encoding='utf-8')); assert c['closed'] is True; assert all(c['checks'].values())"
  cleanup_redelegated: python3 -c "import json; m=json.load(open('/app/output_data/decision_manifest.json',encoding='utf-8')); assert m['cleanup_attempts']>=2; assert m['cleanup_failures']==[1]; assert m['cleanup_redelegations']>=1; assert m['closure_verified'] is True"
reverification_anchors:
  authority_recovery:
  - result_03
  repo_closure:
  - result_06
  cleanup_redelegated:
  - result_05
stale_predicate:
  type: revision_mismatch
  authoritative_fields:
  - secret_hash
  superseded_fields:
  - scan_revision
stale_revalidation:
  candidate_checks:
  - authority_recovery
  - repo_closure
  artifact_checks:
    recovery_report:
    - authority_recovery
    cleanup_report:
    - cleanup_redelegated
    closure_report:
    - repo_closure
information_sufficiency:
- workstream_id: ref_history_scanner
  public_inputs:
  - /app/output_data/scan_reports/ref_history.json
  required_output_fields:
  - found
  - scanned_refs
  - scan_revision
  - report_path
  review_status: reviewed
  requirement_ids:
  - git_leak_authority_cleanup_closure
- workstream_id: pack_scanner
  public_inputs:
  - /app/output_data/scan_reports/pack.json
  required_output_fields:
  - found
  - objects_scanned
  - scan_revision
  - report_path
  review_status: reviewed
  requirement_ids:
  - git_leak_authority_cleanup_closure
- workstream_id: object_database_scanner
  public_inputs:
  - /app/task_file/scripts/scan_objects.py
  - /app/task_file/events/object_authority.json
  - /app/repo
  required_output_fields:
  - found
  - object_id
  - secret_hash
  - source_receipt
  - scan_revision
  - report_path
  review_status: reviewed
  requirement_ids:
  - git_leak_authority_cleanup_closure
- workstream_id: secret_recovery
  public_inputs:
  - /app/task_file/scripts/recover_secret.py
  - /app/output_data/scan_reports
  required_output_fields:
  - source_scan
  - secret_sha256
  - secret_path
  - report_path
  review_status: reviewed
  requirement_ids:
  - git_leak_authority_cleanup_closure
- workstream_id: cleanup_worker
  public_inputs:
  - /app/output_data/cleanup_reports/1.json
  - /app/output_data/cleanup_reports/2.json
  required_output_fields:
  - attempt
  - command
  - report_path
  review_status: reviewed
  requirement_ids:
  - git_leak_authority_cleanup_closure
- workstream_id: cleanup_verifier
  public_inputs:
  - /app/output_data/closure_report.json
  required_output_fields:
  - closed
  - report_path
  review_status: reviewed
  requirement_ids:
  - git_leak_authority_cleanup_closure
legacy_metadata:
  metrics:
    primary:
    - test_point_pass_rate
    - scenario_construction_rate
    - parallel_effect
    - replanning_drop
    - signed_task_order_effect
    diagnostics:
    - stale_retention_rate
    - recovery_latency
    - obsolete_work_ratio
    - reverification_completeness
    - token_consumption
  implementation: structure-derived
  upstream_commit: d28711d0da2675d0bb1d56de45ae5df6082438a3
  asset_copies: []
