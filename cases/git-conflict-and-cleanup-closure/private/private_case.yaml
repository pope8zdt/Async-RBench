format_version: 2
case_id: git-conflict-and-cleanup-closure
classification:
  primary_event_theme: conflicting_valid_results
  secondary_event_themes:
  - delayed_authoritative_result
  async_scenario_class: result_eventful
capabilities:
- conflict_arbitration
- failure_redelegation
- verification_reopen
workstream_bindings:
  ref_history_scanner:
    result_kind: result_01
    validator_command: python3 -c "import base64,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence'];
      assert os.path.isfile(e['report_path']); r=json.load(open(e['report_path'],encoding='utf-8'));
      assert r['scan_kind']=='ref_history'; assert bool(r['found'])==bool(e['found']);
      assert r['scan_revision']==e['scan_revision']; assert r.get('scanned_refs')==e.get('scanned_refs')"
    validator_timeout_sec: 120
    private_evidence_schema:
      found:
        type: boolean
      scanned_refs:
        type: array
      scan_revision:
        type: string
        pattern: '[0-9a-f]{40}'
      report_path:
        type: string
    event_assets: []
  pack_scanner:
    result_kind: result_02
    validator_command: python3 -c "import base64,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence'];
      assert os.path.isfile(e['report_path']); r=json.load(open(e['report_path'],encoding='utf-8'));
      assert r['scan_kind']=='pack'; assert bool(r['found'])==bool(e['found']); assert
      r['scan_revision']==e['scan_revision']; assert r['objects_scanned']==e['objects_scanned']"
    validator_timeout_sec: 120
    private_evidence_schema:
      found:
        type: boolean
      objects_scanned:
        type: integer
      scan_revision:
        type: string
        pattern: '[0-9a-f]{40}'
      report_path:
        type: string
    event_assets: []
  object_database_scanner:
    result_kind: result_03
    validator_command: python3 -c "import base64,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence'];
      assert os.path.isfile(e['report_path']); r=json.load(open(e['report_path'],encoding='utf-8'));
      a=json.load(open('/app/task_file/events/object_authority.json',encoding='utf-8'));
      assert r['scan_kind']=='object_db'; assert bool(r['found']) is True; assert
      r['object_id']==e['object_id']; assert r['secret_hash']==e['secret_hash']; assert
      r['authority_receipt']==e['source_receipt']==a['authority_receipt']"
    validator_timeout_sec: 120
    private_evidence_schema:
      found:
        type: boolean
        enum:
        - true
      object_id:
        type: string
      secret_hash:
        type: string
        pattern: '[0-9a-f]{64}'
      scan_revision:
        type: string
        pattern: '[0-9a-f]{40}'
      report_path:
        type: string
      source_receipt:
        type: string
        pattern: gc-object-authority-[0-9a-f]{16}
    event_assets:
    - /app/task_file/events/object_authority.json
  secret_recovery:
    result_kind: result_04
    validator_command: python3 -c "import base64,hashlib,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence'];
      assert os.path.isfile(e['secret_path']); r=json.load(open(e['report_path'],encoding='utf-8'));
      assert r['source_scan']=='object_db'; assert r['source_scan']==e['source_scan'];
      assert hashlib.sha256(open(e['secret_path'],'rb').read().strip()).hexdigest()==e['secret_sha256']"
    validator_timeout_sec: 120
    private_evidence_schema:
      source_scan:
        type: string
        enum:
        - object_db
      secret_sha256:
        type: string
        pattern: '[0-9a-f]{64}'
      secret_path:
        type: string
      report_path:
        type: string
    event_assets: []
  cleanup_worker:
    result_kind: result_05
    validator_command: python3 -c "import base64,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence'];
      assert os.path.isfile(e['report_path']); r=json.load(open(e['report_path'],encoding='utf-8'));
      assert r['attempt']==e['attempt']; assert r['command']==e['command']"
    validator_timeout_sec: 120
    private_evidence_schema:
      attempt:
        type: integer
      command:
        type: string
      report_path:
        type: string
    event_assets: []
  cleanup_verifier:
    result_kind: result_06
    validator_command: python3 -c "import base64,json,os; e=json.loads(base64.b64decode(os.environ['ASYNC_RBENCH_RESULT_PAYLOAD_B64']))['evidence'];
      assert os.path.isfile(e['report_path']); r=json.load(open(e['report_path'],encoding='utf-8'));
      assert bool(r['closed'])==bool(e['closed'])"
    validator_timeout_sec: 120
    private_evidence_schema:
      closed:
        type: boolean
      report_path:
        type: string
    event_assets: []
result_contract:
  allowed_result_kinds:
  - result_01
  - result_02
  - result_03
  - result_04
  - result_05
  - result_06
  rule: At child spawn assign semantic work_units; at completion tag the result with
    the matching kind. The gateway, not the main agent, receives completion first.
authoritative_result_kind: result_03
superseded_result_kind: result_01
scenarios:
  linear:
    events: []
  async:
    events:
    - id: gc_a_neg
      at: 2
      result: result_01
      invalidates_artifacts: []
      reopens_milestones: []
    - id: gc_a_authority
      at: 4
      result: result_03
      invalidates_artifacts:
      - recovery_report
      - recovered_secret
      reopens_milestones:
      - secret_recovery
    - id: gc_a_verifier
      at: 6
      result: result_06
      invalidates_artifacts:
      - cleanup_report
      reopens_milestones:
      - cleanup_run
artifact_observers: {}
hidden_checks:
  authority_recovery: python3 -c "import hashlib,json,os; m=json.load(open('/app/output_data/decision_manifest.json',encoding='utf-8'));
    a=json.load(open('/app/output_data/scan_reports/object_db.json',encoding='utf-8'));
    assert m['recovery_source']=='object_db'; assert m['authority_object_id']==a['object_id'];
    assert m['recovered_secret_sha256']==a['secret_hash']"
  repo_closure: python3 -c "import json; c=json.load(open('/app/output_data/closure_report.json',encoding='utf-8'));
    assert c['closed'] is True; assert all(c['checks'].values())"
  cleanup_redelegated: python3 -c "import json; m=json.load(open('/app/output_data/decision_manifest.json',encoding='utf-8'));
    assert m['cleanup_attempts']>=2; assert m['cleanup_failures']==[1]; assert m['cleanup_redelegations']>=1;
    assert m['closure_verified'] is True"
reverification_anchors:
  authority_recovery:
  - result_03
  repo_closure:
  - result_06
  cleanup_redelegated:
  - result_05
stale_predicate:
  type: revision_mismatch
  authoritative_fields:
  - secret_hash
  superseded_fields:
  - scan_revision
stale_revalidation:
  candidate_checks:
  - authority_recovery
  - repo_closure
  artifact_checks:
    recovery_report:
    - authority_recovery
    cleanup_report:
    - cleanup_redelegated
    closure_report:
    - repo_closure
information_sufficiency:
- workstream_id: ref_history_scanner
  public_inputs:
  - /app/output_data/scan_reports/ref_history.json
  required_output_fields:
  - found
  - scanned_refs
  - scan_revision
  - report_path
  review_status: reviewed
  requirement_ids: [git_leak_authority_cleanup_closure]
- workstream_id: pack_scanner
  public_inputs:
  - /app/output_data/scan_reports/pack.json
  required_output_fields:
  - found
  - objects_scanned
  - scan_revision
  - report_path
  review_status: reviewed
  requirement_ids: [git_leak_authority_cleanup_closure]
- workstream_id: object_database_scanner
  public_inputs:
  - /app/task_file/scripts/scan_objects.py
  - /app/task_file/events/object_authority.json
  - /app/repo
  required_output_fields:
  - found
  - object_id
  - secret_hash
  - source_receipt
  - scan_revision
  - report_path
  review_status: reviewed
  requirement_ids: [git_leak_authority_cleanup_closure]
- workstream_id: secret_recovery
  public_inputs:
  - /app/task_file/scripts/recover_secret.py
  - /app/output_data/scan_reports
  required_output_fields:
  - source_scan
  - secret_sha256
  - secret_path
  - report_path
  review_status: reviewed
  requirement_ids: [git_leak_authority_cleanup_closure]
- workstream_id: cleanup_worker
  public_inputs:
  - /app/output_data/cleanup_reports/1.json
  - /app/output_data/cleanup_reports/2.json
  required_output_fields:
  - attempt
  - command
  - report_path
  review_status: reviewed
  requirement_ids: [git_leak_authority_cleanup_closure]
- workstream_id: cleanup_verifier
  public_inputs:
  - /app/output_data/closure_report.json
  required_output_fields:
  - closed
  - report_path
  review_status: reviewed
  requirement_ids: [git_leak_authority_cleanup_closure]
legacy_metadata:
  metrics:
    primary:
    - test_point_pass_rate
    - scenario_construction_rate
    - parallel_effect
    - replanning_drop
    - signed_task_order_effect
    diagnostics:
    - stale_retention_rate
    - recovery_latency
    - obsolete_work_ratio
    - reverification_completeness
    - token_consumption
  implementation: structure-derived
  upstream_commit: d28711d0da2675d0bb1d56de45ae5df6082438a3
  asset_copies: []
