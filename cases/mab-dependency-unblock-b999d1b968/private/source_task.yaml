{
  "instruction": "Software Development Task:\n\nPlease write a program called Team_Collaboration_Manager. Team_Collaboration_Manager is a business software application that facilitates collaboration among team members by providing tools for task management, communication, and performance tracking. It allows teams to create and assign tasks, set deadlines, track progress, and evaluate performance, all within a single, integrated platform.\n1. Implementation requirements:\n   - The program should allow users to create and manage projects, including defining project names, start and end dates, and project descriptions.\n   - Users should be able to create tasks within a project, assign them to team members, set deadlines, and track the status of each task (e.g., not started, in progress, completed).\n   - The program should include a messaging system that allows team members to communicate with each other, post updates, and attach files related to tasks or projects.\n   - Each user should have a performance dashboard that displays their task completion rate, average time taken to complete tasks, and any feedback or ratings received from other team members.\n   - The program should generate reports on project progress, team performance, and individual performance metrics, which can be exported in common formats such as PDF or CSV.\n   - Comprehensive test cases must be provided to validate the functionality of the program, including input scenarios for creating and managing projects, assigning and tracking tasks, messaging, and generating reports. Edge cases should include handling invalid inputs, concurrent task assignments, and performance under high load conditions.\n\n\n2. Project structure:\n   - solution.py (main implementation)\n\n3. Development process:\n   - Developer: Create the code.\n   - Developer: Revise the code.\n   - Developer: Optimize the code.\n\nIf there are multiple files, please put them all in solution.py, but remember to add the file name in the following format:\n```python\n# file_name_1.py\n# your code here\n\n# file_name_2.py\n# your code here\n\n# file_name_3.py\n# your code here\n```\n\nPlease work together to complete this task following software engineering best practices.\n\nThe final deliverable should include:\nsolution.py",
