instruction: "This database is used for a Music Streaming platform where users can\
  \ listen to songs, create playlists, track their listening activity, and subscribe\
  \ to premium services. The schema includes tables for users, artists, albums, songs,\
  \ playlists, and subscription details. It also tracks user activities and payments.\n\
  Recently, during operation, the database has seen performance issues. Use sql queries\
  \ to find out what is wrong, and find out the reason that caused it. The root cause\
  \ can be only two of the following: 'INSERT_LARGE_DATA', 'MISSING_INDEXES', 'LOCK_CONTENTION',\
  \ 'VACUUM', 'REDUNDANT_INDEX', 'FETCH_LARGE_DATA', 'POOR_JOIN_PERFORMANCE,CPU_CONTENTION'.\
  \ The planner should assign different agent to analyze possbility for each root\
  \ cause and make final decision. Agents can also chat with each other to share information.\
  \  Please make the decision after using all these tools, as a premature decision\
  \ may lead to incorrect conclusions.\n\nPlease make the decision after exploring\
  \ all rootcauses, as a premature decision may lead to incorrect conclusions.\nPlease\
  \ choose the most likely cause of the database anomaly from the following list,\
  \ based on the expert agents: \n'INSERT_LARGE_DATA', 'LOCK_CONTENTION', 'VACUUM',\
  \ 'REDUNDANT_INDEX', 'FETCH_LARGE_DATA'\nYou can ONLY CHOOSE two.\nYou have access\
  \ to the Database, and you can perform queries to get the required information.\
  \ Agents can also chat with each other to share information.\nThese tables include:\n\
  - `pg_stat_statements` (for detailed query stats)\n- `pg_locks` (for lock waits\
  \ and contention)\n- `pg_stat_user_indexes` (for index usage)\n- `pg_indexes` (for\
  \ index definitions)\n- `pg_stat_all_tables` (detailed statistics about vacuuming,\
  \ auto vacuuming, and analyze operations for each table)\n- `pg_stat_progress_vacuum`\
  \ (for vacuum progress)\n- `pg_stat_user_tables` (for dead tuples and vacuum stats)\n\
  \nASYNC-RBENCH EXTENSION\nFirst persist a provisional comparison of all five declared\
  \ root-cause hypotheses. An independent authority worker then returns a receipt\
  \ bound to the host-owned PostgreSQL checkpoint. Reopen the diagnosis, preserve\
  \ the valid comparison, adopt the authoritative receipt, and close with exactly\
  \ INSERT_LARGE_DATA as the selected cause. Write the final receipt-bound closure\
  \ under /app/output_data."
author_name: Async-RBench transformation
difficulty: medium
category: multiagentbench
tags:
- multiagentbench
- database
- music-streaming
- bulk-ingest
- conflicting_valid_results
parser_name: pytest
max_agent_timeout_sec: 1800
max_test_timeout_sec: 1200
