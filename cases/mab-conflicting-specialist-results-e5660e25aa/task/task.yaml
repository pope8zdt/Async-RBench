instruction: "This database is used in an educational system to manage student, course,\
  \ enrollment, and payment information. It consists of four tables: students, courses,\
  \ enrollments, and payments.\nRecently, during operation, the database has seen\
  \ performance issues. Use sql queries to find out what is wrong, and find out the\
  \ reason that caused it. The root cause can be only two of the following: 'INSERT_LARGE_DATA',\
  \ 'MISSING_INDEXES', 'LOCK_CONTENTION', 'VACUUM', 'REDUNDANT_INDEX', 'FETCH_LARGE_DATA',\
  \ 'POOR_JOIN_PERFORMANCE,CPU_CONTENTION'. The planner should assign different agent\
  \ to analyze possbility for each root cause and make final decision. Agents can\
  \ also chat with each other to share information.  Please make the decision after\
  \ using all these tools, as a premature decision may lead to incorrect conclusions.\n\
  \nPlease make the decision after exploring all rootcauses, as a premature decision\
  \ may lead to incorrect conclusions.\nPlease choose the most likely cause of the\
  \ database anomaly from the following list, based on the expert agents: \n'INSERT_LARGE_DATA',\
  \ 'LOCK_CONTENTION', 'VACUUM', 'REDUNDANT_INDEX', 'FETCH_LARGE_DATA'\nYou can ONLY\
  \ CHOOSE two.\nYou have access to the Database, and you can perform queries to get\
  \ the required information. Agents can also chat with each other to share information.\n\
  These tables include:\n- `pg_stat_statements` (for detailed query stats)\n- `pg_locks`\
  \ (for lock waits and contention)\n- `pg_stat_user_indexes` (for index usage)\n\
  - `pg_indexes` (for index definitions)\n- `pg_stat_all_tables` (detailed statistics\
  \ about vacuuming, auto vacuuming, and analyze operations for each table)\n- `pg_stat_progress_vacuum`\
  \ (for vacuum progress)\n- `pg_stat_user_tables` (for dead tuples and vacuum stats)\n\
  \nASYNC-RBENCH EXTENSION\nPersist a provisional comparison of all declared database\
  \ root-cause hypotheses and do not finalize before the evaluator delivers its case-bound\
  \ authority receipt. Verify the receipt identity and checkpoint digest, revise only\
  \ the affected diagnosis, preserve still-valid database findings, and write database_diagnosis.json\
  \ plus the receipt-bound closure under /app/output_data. Determine the selected and\
  \ superseded causes from the delivered evidence; the public task does not disclose them."
author_name: Async-RBench transformation
difficulty: medium
category: multiagentbench
tags:
- multiagentbench
- database
- education
- vacuum
- delayed_authoritative_result
parser_name: pytest
max_agent_timeout_sec: 1800
max_test_timeout_sec: 1200
