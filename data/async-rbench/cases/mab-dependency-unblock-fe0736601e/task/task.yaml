  "instruction": "Software Development Task:\n\nPlease write a system called CollaborativeSchedulePlanner. CollaborativeSchedulePlanner is a multi-agent scheduling application that enables a team of users to collaboratively manage and optimize their schedules. It allows users to input their individual tasks, set priorities, and share availability, and it dynamically adjusts schedules based on team feedback and constraints to ensure optimal task distribution and time management.\n1. Implementation requirements:\n   - The system should allow multiple users to log in and input their tasks, specifying the task name, duration, priority, and any dependencies on other tasks or team members.\n   - The system should provide a real-time collaborative interface where users can view and edit the shared schedule, and receive notifications when changes are made by other team members.\n   - The system should implement machine learning algorithms to analyze user patterns and preferences, dynamically adjusting task priorities and time slots to optimize the overall team schedule based on real-time feedback and changing conditions.\n   - The system should offer a feature for users to provide feedback on the proposed schedule, allowing the system to make adaptive adjustments to better fit the team's needs.\n   - The system should generate reports and visual representations of the schedule, including Gantt charts and time usage summaries, to help users and teams analyze and optimize their productivity.\n\n\n2. Project structure:\n   - solution.py (main implementation)\n\n3. Development process:\n   - Developer: Create the code.\n   - Developer: Revise the code.\n   - Developer: Optimize the code.\n\nIf there are multiple files, please put them all in solution.py, but remember to add the file name in the following format:\n```python\n# file_name_1.py\n# your code here\n\n# file_name_2.py\n# your code here\n\n# file_name_3.py\n# your code here\n```\n\nPlease work together to complete this task following software engineering best practices.\n\nThe final deliverable should include:\nsolution.py\n\nASYNC-RBENCH EXTENSION\nThe harness then delivers evaluator-owned asynchronous authority through the private event channel.\nBuild CollaborativeSchedulePlanner with users, tasks, duration, priority and dependencies, shared availability, collaborative edits, notifications, adaptive feedback, and Gantt/time-usage reports. Three workstreams create task and collaboration state with a provisional priority schedule. The fourth returns the complete optimizer contract. Replace only affected slot selection, enforce dependency and no-overlap constraints, preserve edits and feedback, and reverify reports.",
