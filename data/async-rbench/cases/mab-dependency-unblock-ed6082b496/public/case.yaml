    remaining budget.
  priority: high
  targets:
  - straggler_receipt
  allowed_files:
  - /app/task_file/input.csv
  - /app/task_file/expected.csv
  required_files:
  - /app/task_file/input.csv
  - /app/task_file/expected.csv
  required_evidence_fields:
  - branch
  - status
  - projected_cost
  - remaining_budget
  - source_sha256
