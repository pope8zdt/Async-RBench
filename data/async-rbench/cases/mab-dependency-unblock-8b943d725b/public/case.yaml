format_version: 2
case_id: mab-dependency-unblock-8b943d725b
title: 'GAIA2 Collaboration meetings: reject a late pre-response calendar snapshot'
source_tasks:
- benchmark: gaia2
  id: scenario_universe_21_5flf8t
  source_sha256: d9ed8608445be20766dbc2067c940cdfca897ee0504485ff6337b846b0f9f947
  evidence_notes: Structure-derived editorial reimplementation of the official GAIA2
    scenario; see PROVENANCE.md.
task_instruction_path: task/task.yaml
artifacts:
- id: late_snapshot_receipt
  path: /app/output_data/late_snapshot_receipt.json
- id: calendar_final
  path: /app/output_data/calendar_final.json
- id: communications_final
  path: /app/output_data/communications_final.json
- id: shopping_final
  path: /app/output_data/shopping_final.json
- id: supersession_manifest
  path: /app/output_data/supersession_manifest.json
milestones:
- id: initial_schedule
  depends_on: []
- id: consume_responses
  depends_on:
  - initial_schedule
- id: reject_late_snapshot
  depends_on:
  - consume_responses
public_checks: []
workstreams:
- id: late_calendar_snapshot
  task: Report event_id, captured_revision, captured_start, captured_end and source_sha256.
  expected_output: The pre-response Joao meeting snapshot.
  priority: high
  targets:
  - late_snapshot_receipt
  allowed_files: &id001
  - /app/task_file/environment_state.json
  required_files: *id001
  required_evidence_fields:
  - event_id
  - captured_revision
  - captured_start
  - captured_end
  - source_sha256
  evidence_schema:
    event_id:
      type: string
    captured_revision:
      type: integer
    captured_start:
      type: string
    captured_end:
      type: string
    source_sha256: &id003
      type: string
      pattern: ^[0-9a-f]{64}$
  public_result_contract:
    kind: payload_only
- id: response_monitor
  task: Report response_count, max_authority_revision, dispositions, source_sha256
    and receipt_sha256.
  expected_output: The three authoritative responses that supersede all initial meeting
    proposals.
  priority: high
  targets:
  - calendar_final
  - shopping_final
  - supersession_manifest
  allowed_files: &id002
  - /app/task_file/environment_state.json
  required_files: *id002
  required_evidence_fields:
  - response_count
  - max_authority_revision
  - dispositions
  - source_sha256
  - receipt_sha256
  evidence_schema:
    response_count:
      type: integer
    max_authority_revision:
      type: integer
    dispositions:
      type: array
    source_sha256: *id003
    receipt_sha256: *id003
  public_result_contract:
    kind: payload_only
- id: calendar_reconciler
  task: Report adopted_revision, rejected_snapshot_revision, current_event_ids, cart_quantity
    and source_sha256.
  expected_output: Revision-aware reconciliation retaining two reschedules and one
    cancellation.
  priority: high
  targets:
  - calendar_final
  - communications_final
  - shopping_final
  allowed_files: &id004
  - /app/task_file/environment_state.json
  required_files: *id004
  required_evidence_fields:
  - adopted_revision
  - rejected_snapshot_revision
  - current_event_ids
  - cart_quantity
  - source_sha256
  evidence_schema:
    adopted_revision:
      type: integer
    rejected_snapshot_revision:
      type: integer
    current_event_ids:
      type: array
    cart_quantity:
      type: integer
    source_sha256: *id003
  public_result_contract:
    kind: payload_only
- id: final_state_validator
  task: Inspect outputs and report calendar_sha256, communications_sha256, shopping_sha256
    and disposition.
  expected_output: Byte-bound closure proving the obsolete meeting snapshot was rejected.
  priority: high
  targets:
  - calendar_final
  - communications_final
  - shopping_final
  - supersession_manifest
  allowed_files: &id005
  - /app/task_file/environment_state.json
  required_files: *id005
  required_evidence_fields:
  - calendar_sha256
  - communications_sha256
  - shopping_sha256
  - disposition
  evidence_schema:
    calendar_sha256: *id003
    communications_sha256: *id003
    shopping_sha256: *id003
    disposition:
      type: string
  public_result_contract:
    kind: payload_only
