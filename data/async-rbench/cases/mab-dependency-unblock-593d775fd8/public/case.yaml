  source_sha256: 82efb1eff1a14a27cd38b26ac7635e27c21210dce0c63ec76d7d1c6e01428a3d
  evidence_notes: Structure-derived editorial reimplementation of the bound SWE-bench
    trace; see PROVENANCE.md.
task_instruction_path: task/task.yaml
artifacts:
- id: partial_receipt
  path: /app/output_data/partial_receipt.json
- id: modular_parser
  path: /app/output_data/catch_message.cpp
- id: single_header_parser
  path: /app/output_data/catch.hpp
- id: verification_report
  path: /app/output_data/verification_report.json
- id: decision_manifest
  path: /app/output_data/decision_manifest.json
milestones:
- id: retain_modular_partial
  depends_on: []
- id: integrate_distribution_completion
  depends_on:
  - retain_modular_partial
- id: verify_synchronized_closure
  depends_on:
