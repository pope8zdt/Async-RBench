instruction: "<pr_description>\nConsider the following PR description:\nSimple fix\
  \ to allow CAPTURE to handle string with comma. Also ignores\r\nbrackets in string.\
  \ No quotation mark escaping is implemented, so `\"\\\"\"`\r\nand `'\"'` will still\
  \ fail.\r\n\r\nFixes #1607 \r\n\r\nI can improve parsing algorithm to handle single\
  \ and double quotes correctly, but that is probably overkill ...\r\n\r\n\r\n\n</pr_description>\n\
  \n<instructions>\n# Task Instructions\n\n## Overview\nYou're a software engineer\
  \ interacting continuously with a computer by submitting commands.\nYou'll be helping\
  \ implement necessary changes to meet requirements in the PR description.\nYour\
  \ task is specifically to make changes to non-test files in the current directory\
  \ in order to fix the issue described in the PR description in a way that is general\
  \ and consistent with the codebase.\n\nIMPORTANT: This is an interactive process\
  \ where you will think and issue ONE command, see its result, then think and issue\
  \ your next command.\n\nFor each response:\n1. Include a THOUGHT section explaining\
  \ your reasoning and what you're trying to accomplish\n2. Provide exactly ONE bash\
  \ command to execute\n\n## Important Boundaries\n- MODIFY: Regular source code files\
  \ in the current working directory (this is the working directory for all your subsequent\
  \ commands)\n- DO NOT MODIFY: Tests, project configuration files (e.g., build configs,\
  \ lockfiles, CI configs), or environment setup unless the PR description explicitly\
  \ requires it.\n\n## Recommended Workflow\n1. Analyze the codebase by finding and\
  \ reading relevant files\n2. Create a script to reproduce the issue\n3. Edit the\
  \ source code to resolve the issue\n4. Verify your fix works by running your script\
  \ again\n5. Test edge cases to ensure your fix is robust\n\n## Command Execution\
  \ Rules\nYou are operating in an environment where\n1. You write a single command\n\
  2. The system executes that command in a subshell\n3. You see the result\n4. You\
  \ write your next command\n\nEach response should include:\n1. A **THOUGHT** section\
  \ where you explain your reasoning and plan\n2. A single bash code block with your\
  \ command\n\nFormat your responses like this:\n\n<format_example>\nTHOUGHT: Here\
  \ I explain my reasoning process, analysis of the current situation,\nand what I'm\
  \ trying to accomplish with the command below.\n\n```bash\nyour_command_here\n```\n\
  </format_example>\n\n**CRITICAL REQUIREMENTS:**\n- Your response SHOULD include\
  \ a THOUGHT section explaining your reasoning\n- Your response MUST include EXACTLY\
  \ ONE bash code block\n- This bash block MUST contain EXACTLY ONE command (or a\
  \ set of commands connected with && or ||)\n- If you include zero or multiple bash\
  \ blocks, or no command at all, YOUR RESPONSE WILL FAIL\n- Do NOT try to run multiple\
  \ independent commands in separate blocks in one response\n- Directory or environment\
  \ variable changes are not persistent. Every action is executed in a new subshell.\n\
  - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir\
  \ && ...` or write/load environment variables from files\n\n## Explore-context Marking\
  \ (STRICT, REQUIRED FOR FILE READING)\nWhen you are exploring code context (reading\
  \ files / printing line ranges), you MUST include a machine-parseable\nexplore-context\
  \ block BEFORE your bash code block. This is independent of the command you use\
  \ (cat/sed/nl/head/etc).\n\n**When NOT to include `<EXPLORE_CONTEXT>`:**\n- Do NOT\
  \ include it for non-reading exploration like `ls -la`, `find`, `rg/grep` (search-only),\
  \ `git status`, etc.\n- Only include it when your command will PRINT actual source\
  \ code content (a file snippet / line range) to stdout\n  for you to read.\n\n**Explore-context\
  \ block format (STRICT):**\n- MUST be enclosed in `<EXPLORE_CONTEXT> ... </EXPLORE_CONTEXT>`\
  \ tags.\n- Inside, include ONE OR MORE entries, each entry exactly:\n  `File: /absolute/path/to/file.ext`\n\
  \  `Lines: <start>-<end>`\n- Multiple entries are separated by a blank line.\n-\
  \ Use ABSOLUTE paths only.\n- `<start>` and `<end>` MUST be positive integers and\
  \ `<start> <= <end>`.\n- Do NOT include any other text (no explanation, no code,\
  \ no extra keys).\n\n**Command/output consistency (STRICT):**\nYour bash command\
  \ MUST print the declared file line range(s) to stdout (the terminal output we see),\n\
  so we can map `<EXPLORE_CONTEXT>` entries to the observed `<output>` content.\n\n\
  **Good examples:**\n<EXPLORE_CONTEXT>\nFile: /testbed/src/foo.ext\nLines: 10-40\n\
  </EXPLORE_CONTEXT>\n\n```bash\nnl -ba /testbed/src/foo.ext | sed -n '10,40p'\n```\n\
  \n<EXPLORE_CONTEXT>\nFile: /testbed/src/a.ext\nLines: 1-80\n\nFile: /testbed/src/b.ext\n\
  Lines: 120-160\n</EXPLORE_CONTEXT>\n\n```bash\n(nl -ba /testbed/src/a.ext | sed\
  \ -n '1,80p' && echo '---' && nl -ba /testbed/src/b.ext | sed -n '120,160p')\n```\n\
  \n## Environment Details\n- You have a full Linux shell environment\n- Always use\
  \ non-interactive flags (-y, -f) for commands\n- Avoid interactive tools like vi,\
  \ nano, or any that require user input\n- If a command isn't available, you can\
  \ install it\n\n## Multi-SWE-bench Specific Notes\n- You are working in a Multi-SWE-bench\
  \ environment with multi-language repositories\n- The project may be in a subdirectory\
  \ (e.g., /home/repo-name/)\n- Git repository is typically located in the project\
  \ subdirectory\n- When working with Git operations, ensure you're in the correct\
  \ repository directory\n\n## Useful Command Examples\n\n### Create a new file:\n\
  ```bash\ncat <<'EOF' > newfile.txt\nhello world\nEOF\n```\n\n### Edit files with\
  \ sed:\n```bash\n# Replace all occurrences\nsed -i 's/old_string/new_string/g' filename.ext\n\
  \n# Replace only first occurrence\nsed -i 's/old_string/new_string/' filename.ext\n\
  \n# Replace first occurrence on line 1\nsed -i '1s/old_string/new_string/' filename.ext\n\
  \n# Replace all occurrences in lines 1-10\nsed -i '1,10s/old_string/new_string/g'\
  \ filename.ext\n```\n\n### View file content:\n```bash\n# View specific lines with\
  \ numbers\nnl -ba filename.ext | sed -n '10,20p'\n```\n\n## Submission\nWhen you've\
  \ completed your work (reading, editing, testing), and cannot make further progress\n\
  issue exactly the following command:\n\n```bash\necho COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\
  \ && (git status >/dev/null 2>&1 && git add -A && git diff --cached) || (cd */.\
  \ 2>/dev/null && git add -A && git diff --cached) || (find . -name '.git' -type\
  \ d -exec sh -c 'cd \"$(dirname \"{}\")\" && git add -A && git diff --cached' \\\
  ; 2>/dev/null | head -n 1000) || (echo \"Error: No git repository found\")\n```\n\
  \nThis command will submit your work.\nYou cannot continue working (reading, editing,\
  \ testing) in any way on this task after submitting.\n</instructions>\n\nASYNC-RBENCH\
  \ EXTENSION\nThe deterministic repository snapshot and parser probes are under /app/task_file.\
  \ The Capturer parser exists in both include/internal/catch_message.cpp and single_include/catch2/catch.hpp.\
  \ A delegated audit first confirms the modular implementation and literal comma/bracket\
  \ behavior but reports the single-header distribution as pending. Its later completion\
  \ confirms the same parser logic and probe behavior in the single-header distribution.\n\
  \nWrite five artifacts under /app/output_data: partial_receipt.json, catch_message.cpp,\
  \ catch.hpp, verification_report.json, and decision_manifest.json. Retain the verified\
  \ modular work, complete the single-header copy, keep both implementations synchronized,\
  \ handle commas and brackets inside single- or double-quoted strings, preserve the\
  \ stated limitation that quote escaping is unsupported, and bind exact output hashes\
  \ in the manifest. Do not treat the partial result as complete and do not redo or\
  \ discard its verified modular findings.\n"
