  "instruction": "Software Development Task:\n\nPlease write a program called 'EcoSphere Manager' that simulates the management of a complex, interconnected ecosystem. EcoSphere Manager is a simulation game where players can manage and maintain the balance of a virtual ecosystem, including various species of plants and animals, water and land resources, and environmental factors. Players will need to make strategic decisions to ensure the survival and prosperity of the ecosystem, while adapting to unexpected changes and challenges.\n1. Implementation requirements:\n   - The program should allow players to introduce and manage different species of plants and animals, including setting population limits, food sources, and habitats.\n   - The ecosystem should dynamically respond to player actions and environmental changes, such as climate variations, pollution levels, and natural disasters. The system should provide feedback on the health and stability of the ecosystem based on these factors.\n   - The program should include a feature for players to collaborate in real-time, allowing multiple players to manage different aspects of the ecosystem. Players should be able to communicate and coordinate their efforts to achieve common goals, such as restoring a damaged habitat or preventing overpopulation of certain species.\n   - The system should provide adaptive challenges and scenarios that require players to adjust their strategies based on the current state of the ecosystem. For example, the introduction of an invasive species could force players to work together to develop a plan to control its spread.\n   - The program should include a user-friendly interface with clear visualizations of the ecosystem, including maps, population graphs, and environmental indicators. Players should be able to access detailed information about each species and environmental factor, as well as receive notifications about critical events or changes in the ecosystem.\n\n\n2. Project structure:\n   - solution.py (main implementation)\n\n3. Development process:\n   - Developer: Create the code.\n   - Developer: Revise the code.\n   - Developer: Optimize the code.\n\nIf there are multiple files, please put them all in solution.py, but remember to add the file name in the following format:\n```python\n# file_name_1.py\n# your code here\n\n# file_name_2.py\n# your code here\n\n# file_name_3.py\n# your code here\n```\n\nPlease work together to complete this task following software engineering best practices.\n\nThe final deliverable should include:\nsolution.py\n\nASYNC-RBENCH EXTENSION\nPersist species, habitat, collaboration, and visualization state while ecosystem updates are provisional. The harness then delivers the complete deterministic tick contract. Atomically derive populations, resources, environmental deltas, and health from state plus seed, preserve collaboration records, and reverify deterministic closure.",
