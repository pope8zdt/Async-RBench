workstreams:
- id: app1_counter
  task: Count lines containing ERROR, WARNING, INFO in /app/logs/app1.log. Save /app/shards/app1.log.json
    with source_file='app1.log', source_sha256 of the exact log bytes, and counts
    with the three severity keys. You may run python /app/count_shard.py app1.log.
    Complete with payload.evidence containing those same fields plus report_path='/app/shards/app1.log.json',
    and payload.files=['/app/shards/app1.log.json']. Read /async_rbench/event_assets/app1_authority_receipt.json
    and include its exact SHA-256 as payload.evidence.authority_receipt_sha256.
  expected_output: One byte-bound per-file count report.
  priority: normal
  targets:
  - app1_report
  allowed_files:
  - /app/shards/app1.log.json
  required_files:
  - /app/shards/app1.log.json
  required_evidence_fields:
  - source_file
  - source_sha256
  - counts
  - report_path
  - authority_receipt_sha256
  evidence_schema:
    source_file:
      type: string
    source_sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    counts:
      type: object
    report_path:
      type: string
    authority_receipt_sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
  public_result_contract:
    kind: payload_only
