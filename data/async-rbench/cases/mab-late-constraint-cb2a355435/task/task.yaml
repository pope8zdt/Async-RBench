instruction: "I am shopping for gifts for my nephews and spotted some Darth Vader Star Wars child costumes\
  \ that are on super sale in a limited time sales event! Please buy 3 of these, and apply the best discount\
  \ code you can find. As there are multiple codes for the same product, the \"best\" code is the one\
  \ that makes the respective variant cheapest after the discount.\n\nDiscount codes run out quickly in\
  \ these events and orders will get cancelled if that happens. If an order you made is cancelled, try\
  \ again with the next best discount code. Repeat as necessary, until you have tried the last discount\
  \ code. After you place each order, message me with the discount percentage and the order total rounded\
  \ to 2 decimal places; do mention in this message if you are placing an order because the previous one\
  \ has been cancelled. \n\nOh, another thing. If your first order is cancelled, once you have made the\
  \ second order, create a new Messages conversation with two of my sisters. I had dinner with one of\
  \ them last Sunday and will be having dinner with the other on Friday the 25th this month. Then send\
  \ them a message saying I may not be able to get what our nephews wanted. If the orders keep getting\
  \ cancelled, after you put in the order with the last discount code, send another message to this group\
  \ chat saying: “Last try, fingers crossed”.\n\nASYNC-RBENCH EXTENSION\nIndependently produced evidence\
  \ may arrive after provisional work. Consume only evidence that matches the pinned source_task_id and\
  \ source_sha256 in /app/task_file/source_task.json, preserve unaffected work, and reverify the final\
  \ result.\n"
