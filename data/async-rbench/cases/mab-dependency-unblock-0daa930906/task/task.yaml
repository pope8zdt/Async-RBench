instruction: 'I need a vinyl 2" HALLOWEEN DUCKY MIX for my Halloween post on Instagram,
  but it''s unavailable. Keep checking If it becomes available during the next 4 minutes
  from now, and purchase it immediately if it does. Also, send a message to Akira
  Lundström, informing her about the availability, as soon as the product becomes
  available. Send it on Messages if I have a conversation with her, otherwise, send
  it on Chats. Once you’ve successfully placed the order, send me a confirmation message,
  but don''t notify me about anything else.


  ASYNC-RBENCH EXTENSION

  The deterministic application snapshot is at /app/task_file/environment_state.json.
  The requested product becomes available at second 90 of the four-minute window.
  The Messages snapshot has no conversation with Akira Lundström; Chats identifies
  her as user b6f1ec1a-01b4-4e41-b31a-b3d7a87ecde0. A delegated recipient resolver
  remains pending at second 88 and is projected to finish after the deadline, while
  a direct Chats lookup can finish in 3 seconds.


  Write five artifacts under /app/output_data: recipient_lookup_receipt.json, shopping_final.json,
  messaging_final.json, user_notifications.json, and resource_decision_manifest.json.
  Purchase exactly one requested product by second 94, send exactly one availability
  message to Akira on Chats, send no Messages message, and notify the user exactly
  once only after the order succeeds. Preserve unrelated products, conversations,
  users, and messages. The manifest must bind exact hashes, identify the stock event
  as critical, record the recipient resolver as cancelled_and_replaced, and record
  the direct Chats fallback.


  Do not wait for the low-value recipient straggler after stock availability is authoritative.
  Prioritize the time-critical purchase, cancel or bypass the straggler, and use the
  bounded direct lookup without exceeding the four-minute window.'
author_name: Async-RBench transformation
difficulty: medium
category: personal-assistant
tags:
- gaia2
