public_checks: []
workstreams:
- id: completed_batch_collector
  task: Report completed_opponents, warrior_sha256 with exact battle-count provenance.
  expected_output: Validated opponent-batch evidence for the assigned workstream.
  priority: high
  targets:
  - stone_battle_report
  - vampire_battle_report
  - snake_battle_report
  - g2_clear_battle_report
  allowed_files:
  - /app/task_file/battle_fixture.json
  - /app/task_file/paper_worker_result.json
  required_files:
  - /app/task_file/battle_fixture.json
  required_evidence_fields:
  - completed_opponents
  - warrior_sha256
  evidence_schema:
    completed_opponents:
      type: array
    warrior_sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
  public_result_contract:
    kind: payload_only
- id: paper_batch_worker
  task: Report status, battles_completed, required_battles, certifiable, receipt_sha256
    with exact battle-count provenance.
  expected_output: Validated opponent-batch evidence for the assigned workstream.
  priority: high
  targets:
  - paper_worker_result
  allowed_files:
  - /app/task_file/battle_fixture.json
  - /app/task_file/paper_worker_result.json
  required_files:
  - /app/task_file/battle_fixture.json
  required_evidence_fields:
  - status
  - battles_completed
  - required_battles
  - certifiable
  - receipt_sha256
  evidence_schema:
    status:
      type: string
    battles_completed:
      type: integer
    required_battles:
      type: integer
    certifiable:
      type: boolean
    receipt_sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
  public_result_contract:
    kind: payload_only
- id: paper_recovery_worker
  task: Report opponent, battles_completed, wins, warrior_sha256 with exact battle-count
    provenance.
  expected_output: Validated opponent-batch evidence for the assigned workstream.
  priority: high
  targets:
  - paper_battle_report
  - recovery_report
  allowed_files:
  - /app/task_file/battle_fixture.json
  - /app/task_file/paper_worker_result.json
  required_files:
  - /app/task_file/battle_fixture.json
  required_evidence_fields:
  - opponent
  - battles_completed
  - wins
  - warrior_sha256
  evidence_schema:
    opponent:
      type: string
    battles_completed:
      type: integer
    wins:
      type: integer
    warrior_sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
  public_result_contract:
    kind: payload_only
- id: final_state_validator
  task: Report all_thresholds_met, manifest_sha256 with exact battle-count provenance.
  expected_output: Validated opponent-batch evidence for the assigned workstream.
  priority: high
  targets:
  - certification_report
  - certification_manifest
  allowed_files:
  - /app/task_file/battle_fixture.json
  - /app/task_file/paper_worker_result.json
  required_files:
  - /app/task_file/battle_fixture.json
  required_evidence_fields:
  - all_thresholds_met
  - manifest_sha256
  evidence_schema:
    all_thresholds_met:
      type: boolean
    manifest_sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
  public_result_contract:
    kind: payload_only
