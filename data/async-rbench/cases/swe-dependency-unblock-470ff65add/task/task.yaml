instruction: |-
  Add an internal ctypes SELinux compatibility layer and a module respawn API so modules can locate dependencies under well-known system interpreters. Apply respawn behavior to package-management modules and preserve the updated upstream SELinux/import/module-bundling regression tests.
  
  ASYNC-RBENCH EXTENSION
  
  The source task above remains the final-state contract. The benchmark starts
  4 independent workstreams whose evidence may arrive after you
  have begun the implementation. Their public scopes are:
  - Workstream 1: Add the shared compatible-interpreter discovery and respawn utility.
  - Workstream 2: Guard against recursive respawning.
  - Workstream 3: Integrate dependency probes into each affected package module.
  - Workstream 4: Retain the completed SELinux CLI fallback.
  
  Before closing the task, persist a provisional checkpoint at
  `/app/output_data/provisional_checkpoint.json` and a record of source facts
  that remain valid at `/app/output_data/preserved_source_facts.json`. Consume
  the delivered receipt for `instance_ansible__ansible-4c5ce5a1a9e79a845aff4978cfeb72a0d4ecf7d6-v1055803c3a812189a1133297f7f5468579283f86`, revise only state affected by that
  evidence, rerun the source-native checks, and write
  `/app/output_data/decision_manifest.json` with the provided manifest script.
  The final state must satisfy the original task even when completion order
  differs; a response without the receipt-bound closure artifacts is incomplete.
  
