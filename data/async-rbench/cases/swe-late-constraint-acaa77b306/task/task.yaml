instruction: |-
  Add the experimental stable-output decompression parameter so callers with a sufficiently large, immutable output buffer can avoid the internal output allocation and copy. Fix single-pass handling for empty frames and preserve safe behavior for undersized or modified buffers. Validate the change with the native streaming and fuzz regressions.
  
  ASYNC-RBENCH EXTENSION
  
  The source task above remains the final-state contract. The benchmark starts
  4 independent workstreams whose evidence may arrive after you
  have begun the implementation. Their public scopes are:
  - Workstream 1: Add and initialize the stable-output decompression parameter.
  - Workstream 2: Use the caller buffer only when the full frame fits and invariants hold.
  - Workstream 3: Make empty frames eligible without the four-byte allocation.
  - Workstream 4: Retain safe behavior for undersized or unstable buffers.
  
  Before closing the task, persist a provisional checkpoint at
  `/app/output_data/provisional_checkpoint.json` and a record of source facts
  that remain valid at `/app/output_data/preserved_source_facts.json`. Consume
  the delivered receipt for `facebook__zstd-2094`, revise only state affected by that
  evidence, rerun the source-native checks, and write
  `/app/output_data/decision_manifest.json` with the provided manifest script.
  The final state must satisfy the original task even when completion order
  differs; a response without the receipt-bound closure artifacts is incomplete.
  
