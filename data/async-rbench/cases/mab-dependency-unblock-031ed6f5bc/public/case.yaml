format_version: 2
case_id: mab-dependency-unblock-031ed6f5bc
title: 'Terminal-Bench blind maze: deduplicate a replayed exploration batch'
source_tasks:
- benchmark: terminal-bench
  id: blind-maze-explorer-algorithm
  upstream_commit: d28711d0da2675d0bb1d56de45ae5df6082438a3
  upstream_path: private/source
  source_sha256: 63a713f34bb7183ccc86b7a13e01ed564ea704d064eed6ab309989743b40ea10
  source_task_definition_sha256: 63a713f34bb7183ccc86b7a13e01ed564ea704d064eed6ab309989743b40ea10
  source_lock: private/source_lock.json
  preserved_test: private/source/test_outputs.py
task_instruction_path: task/task.yaml
artifacts:
- id: maze_outputs
  path: /app/output
- id: batch_receipt
  path: /app/reports/batch-01-03.json
- id: integration_manifest
  path: /app/integration_manifest.json
milestones:
- id: materialize_maps
  depends_on: []
- id: integrate_batch_completion
  depends_on:
  - materialize_maps
- id: deduplicate_replay
  depends_on:
  - integrate_batch_completion
public_checks: []
workstreams:
- id: batch_explorer
  task: Report the authoritative maze 1–3 completion identity, maze IDs, revision,
    map hashes, and receipt hash.
  expected_output: One byte-bound maze-batch completion that may be replayed.
  priority: high
  targets:
  - batch_receipt
  allowed_files:
  - /app/task_file/maze_plan.json
  - /app/task_file/batch_01_03_authority_receipt.json
  required_files:
  - /app/task_file/maze_plan.json
  - /app/task_file/batch_01_03_authority_receipt.json
  required_evidence_fields:
  - completion_id
  - maze_ids
  - source_revision
  - map_sha256
  - receipt_sha256
  evidence_schema:
    completion_id:
      type: string
    maze_ids:
      type: array
    source_revision:
      type: string
    map_sha256:
      type: object
    receipt_sha256: &id001
      type: string
      pattern: ^[0-9a-f]{64}$
  public_result_contract:
    kind: payload_only
- id: remaining_maps
  task: Report the complete distinct maze ID population and plan hash.
  expected_output: All ten maze observations accounted for.
  priority: high
  targets:
  - maze_outputs
  allowed_files:
  - /app/task_file/maze_plan.json
  required_files:
  - /app/task_file/maze_plan.json
  required_evidence_fields:
  - maze_ids
  - map_count
  - plan_sha256
  evidence_schema:
    maze_ids:
      type: array
    map_count:
      type: integer
    plan_sha256: *id001
  public_result_contract:
    kind: payload_only
- id: replay_guard
  task: Report completion identity, delivery count, contribution count, disposition,
    and plan hash.
  expected_output: Replay-safe batch contribution ledger.
  priority: high
  targets:
  - integration_manifest
  allowed_files:
  - /app/task_file/maze_plan.json
  required_files:
  - /app/task_file/maze_plan.json
  required_evidence_fields:
  - completion_id
  - delivery_count
  - contribution_count
  - disposition
  - plan_sha256
  evidence_schema:
    completion_id:
      type: string
    delivery_count:
      type: integer
    contribution_count:
      type: integer
    disposition:
      type: string
    plan_sha256: *id001
  public_result_contract:
    kind: payload_only
- id: final_state_validator
  task: Report every map hash, manifest hash, and replay disposition.
  expected_output: Byte-bound ten-maze closure.
  priority: high
  targets:
  - maze_outputs
  - integration_manifest
  allowed_files:
  - /app/task_file/maze_plan.json
  required_files:
  - /app/task_file/maze_plan.json
  required_evidence_fields:
  - map_sha256
  - manifest_sha256
  - disposition
  evidence_schema:
    map_sha256:
      type: object
    manifest_sha256: *id001
    disposition:
      type: string
  public_result_contract:
    kind: payload_only
