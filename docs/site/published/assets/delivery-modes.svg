<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Async main setting and Batched experimental baseline</title>
  <desc id="desc">Async is the main evaluation setting, presenting eligible results individually as the main agent continues and replans. Batched is the experimental baseline, presenting results together after required workflows finish. Both run subagents concurrently. Blocks represent conceptual stages, not measured time or speedup.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#343b42"/></marker><style>text{font-family:Arial,'Helvetica Neue',sans-serif;fill:#26333b;font-size:22px}.title{font-size:29px;font-weight:600}.note{font:18px Arial,sans-serif}.box{stroke:#647079;stroke-width:1.5;rx:7}.flow{fill:none;stroke:#343b42;stroke-width:1.7;marker-end:url(#arrow)}.wire{fill:none;stroke:#343b42;stroke-width:1.5}.small{font-size:19px}</style></defs>
  <rect width="1280" height="560" fill="#fff"/>
  <rect class="box" x="22" y="20" width="600" height="470" fill="#f2f3f0"/><rect class="box" x="658" y="20" width="600" height="470" fill="#edf3f8"/>
  <text class="title" x="48" y="66">Batched — experimental baseline</text><text class="note" x="48" y="101">Concurrent execution · collective presentation</text>
  <text class="title" x="684" y="66">Async — main setting</text><text class="note" x="684" y="101">Concurrent execution · individual presentation</text>
  <text class="small" x="48" y="160">Children</text><text class="small" x="684" y="160">Children</text>
  <rect class="box" x="160" y="134" width="150" height="42" fill="#e2f0e7"/><text x="235" y="162" text-anchor="middle">Result A</text>
  <rect class="box" x="160" y="195" width="235" height="42" fill="#d9eef0"/><text x="277" y="223" text-anchor="middle">Result B</text>
  <rect class="box" x="160" y="256" width="320" height="42" fill="#e2e7f6"/><text x="320" y="284" text-anchor="middle">Result C</text>
  <path class="wire" d="M310 155H530V277H480M395 216H530"/><path class="flow" d="M530 277V330"/>
  <rect class="box" x="388" y="334" width="200" height="48" fill="#f6e7eb"/><text x="488" y="365" text-anchor="middle">Present A + B + C</text><path class="flow" d="M488 382V413"/>
  <text class="small" x="48" y="445">Main agent</text><rect class="box" x="160" y="417" width="428" height="44" fill="#fff9e9"/><text x="374" y="446" text-anchor="middle">Continue with the result bundle</text>
  <rect class="box" x="796" y="134" width="150" height="42" fill="#e2f0e7"/><text x="871" y="162" text-anchor="middle">Result A</text>
  <rect class="box" x="796" y="195" width="235" height="42" fill="#d9eef0"/><text x="913" y="223" text-anchor="middle">Result B</text>
  <rect class="box" x="796" y="256" width="320" height="42" fill="#e2e7f6"/><text x="956" y="284" text-anchor="middle">Result C</text>
  <path class="flow" d="M946 155H1204V315H868V330"/>
  <path class="flow" d="M1031 216H1188V305H1021V330"/>
  <path class="flow" d="M1116 277H1174V330"/>
  <rect class="box" x="796" y="334" width="142" height="48" fill="#f6e7eb"/><text x="867" y="365" text-anchor="middle">Present A</text>
  <rect class="box" x="950" y="334" width="142" height="48" fill="#f6e7eb"/><text x="1021" y="365" text-anchor="middle">Present B</text>
  <rect class="box" x="1104" y="334" width="130" height="48" fill="#f6e7eb"/><text x="1169" y="365" text-anchor="middle">Present C</text>
  <path class="flow" d="M867 382V413"/><path class="flow" d="M1021 382V413"/><path class="flow" d="M1169 382V413"/>
