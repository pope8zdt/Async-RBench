<title id="title">Async-RBench — a worked evaluation workflow</title>
<desc id="desc">The secure-release task illustrates real inputs, changed Git revisions, a recorded patch command and archived checks. A separate strip explains paper-26 DRS and task-success scoring, without assigning a new score to the archived run.</desc>
