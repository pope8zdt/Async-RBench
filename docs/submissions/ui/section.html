<section id="participate" class="research-chapter" data-submission-root aria-labelledby="submission-heading">

    <h2 id="submission-heading"><span class="i18n" lang="zh">提交结果</span><span class="i18n" lang="en">Submit Results</span></h2>
  </div>

  <div class="submission-toolbar">

      <button type="button" data-view="submit" aria-current="page"><span class="i18n" lang="zh">提交</span><span class="i18n" lang="en">Submit</span></button>
      <button type="button" data-view="review"><span class="i18n" lang="zh">审核</span><span class="i18n" lang="en">Review</span></button>

      <option value="other-participant" data-zh="另一位参评者" data-en="Another participant">Another participant</option>
      <option value="maintainer" data-zh="维护者" data-en="Maintainer">Maintainer</option>
