name: Validate Track B

on:
  push:
    paths:
      - 'async_rbench/track_b/**'
      - 'configs/track-b/**'
      - 'docker/track-b/**'
      - 'tests/test_track_b*.py'
      - 'website/components/evaluate-form.tsx'
      - 'website/lib/track-b.*'
      - 'website/tests/track-b.test.mjs'
      - '.github/workflows/track-b.yml'
  pull_request:
    paths:
      - 'async_rbench/track_b/**'
      - 'configs/track-b/**'
      - 'docker/track-b/**'
      - 'tests/test_track_b*.py'
      - 'website/components/evaluate-form.tsx'
      - 'website/lib/track-b.*'
      - 'website/tests/track-b.test.mjs'
      - '.github/workflows/track-b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_track_b*.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: node --test tests/track-b.test.mjs
        working-directory: website
