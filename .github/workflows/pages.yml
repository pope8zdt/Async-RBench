name: Publish benchmark website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml', 'experiments/formal-47/**', 'async_rbench/main_experiment.py', 'async_rbench/main_results.py', 'evaluation_contract.json', 'cases/**', 'event_taxonomy.json', 'submissions/**', 'async_rbench/submissions*.py', 'tests/test_submissions.py']
  pull_request:
    paths: ['website/**', '.github/workflows/pages.yml', 'experiments/formal-47/**', 'async_rbench/main_experiment.py', 'async_rbench/main_results.py', 'evaluation_contract.json', 'cases/**', 'event_taxonomy.json', 'submissions/**', 'async_rbench/submissions*.py', 'tests/test_submissions.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m async_rbench.submissions check --root .
        working-directory: .
      - run: python -m unittest discover -s tests -p 'test_submissions.py'
        working-directory: .
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm run test:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
