name: Publish paper website

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'assets/**'
      - 'data/async-rbench/**'
      - 'paper_artifacts/experiment_manifest.json'
      - 'configs/dataset-policy.json'
      - 'configs/model-profiles/experiment-profile.template.yaml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'assets/**'
      - 'data/async-rbench/**'
      - 'paper_artifacts/experiment_manifest.json'
      - 'configs/dataset-policy.json'
      - 'configs/model-profiles/experiment-profile.template.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public package dependencies
        run: python -m pip install -e .
      - name: Test generated pages and public data boundary
        run: python -m unittest discover -s docs/site/tests -p 'test_*.py'
      - name: Test ranking and task filters
        run: node --test docs/site/tests/logic.test.mjs
      - name: Build GitHub Pages artifact
        run: python docs/site/build.py --output dist/site --base-path /Async-RBench
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
