name: Publish paper website

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/submissions/**'
      - 'src/async_rbench/submissions/**'
      - 'assets/**'
      - 'data/async-rbench/**'
      - 'paper_artifacts/experiment_manifest.json'
      - 'configs/dataset-policy.json'
      - 'configs/model-profiles/experiment-profile.template.yaml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/submissions/**'
      - 'src/async_rbench/submissions/**'
      - 'assets/**'
      - 'data/async-rbench/**'
      - 'paper_artifacts/experiment_manifest.json'
      - 'configs/dataset-policy.json'
      - 'configs/model-profiles/experiment-profile.template.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public package dependencies
        run: python -m pip install -e '.[test]'
      - name: Test generated pages and public data boundary
        run: python -m unittest discover -s docs/site/tests -p 'test_*.py'
      - name: Test ranking and task filters
        run: node --test docs/site/tests/logic.test.mjs
      - name: Validate public snapshot and selected evidence
        run: python -m unittest discover -s docs/site/publication-tests -p 'test_*.py'
      - name: Test public trajectories and evaluation guide
        run: node --test docs/site/publication-tests/publication.test.mjs
      - name: Test submission integrity and review lifecycle without network calls
        run: python -m pytest tests/test_result_integrity.py tests/test_submission_artifacts.py tests/test_github_submissions.py tests/test_github_submission_server.py tests/test_submission_publication.py -q
      - name: Test static submission preparation
        run: node --test docs/submissions/ui/github-app.test.mjs docs/submissions/ui/github-static.test.mjs
      - name: Build GitHub Pages artifact
        run: python docs/site/publication.py --output dist/site --base-path /Async-RBench
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
