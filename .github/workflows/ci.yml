name: public-release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Validate public corpus
        run: async-rbench validate-public
      - name: Test
        run: python -m pytest -q
