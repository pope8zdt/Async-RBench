name: Track A evaluation submission
description: Submit a participant-run result for maintainer review.
title: '[Track A submission] '
body:
  - type: markdown
    attributes:
      value: |
        This is a public submission. Include only material cleared for public sharing.
        Keep API keys, hidden scoring material, private case paths and raw private traces out of this issue.
        Track B simulation is not eligible. Submission and maintainer review do not imply independent reproduction.
        Use the fixed experiments/formal-47/instances.txt cohort: 47 cases, 3 repetitions per mode, 282 planned episodes. Historical dataset splits are not submission filters.
  - type: input
    id: model
    attributes:
      label: Main model and exact version
    validations:
      required: true
  - type: input
    id: benchmark-version
    attributes:
      label: Benchmark tag and commit SHA
    validations:
      required: true
  - type: textarea
    id: run-settings
    attributes:
      label: Reproduction settings and coverage
      description: Include the formal-47 selection digest, harness version, environment, seed 2026, 3 repetitions per mode, completed cases out of 47, scored episodes out of 282 and all failures. Omit private instance identifiers.
    validations:
      required: true
  - type: textarea
    id: public-results
    attributes:
      label: Public result summary and supporting material
      description: Attach the validated aggregate-only submission JSON generated by python -m async_rbench.submissions package, or link to a PR adding it under submissions/entries/<submissionId>.json. Include its submissionId and contentSha256; reviewers add the separate review record. Do not attach unreviewed raw artifacts. State whether the run is self-reported or independently reproduced.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Submission acknowledgement
      options:
        - label: This is a real Track A run. I understand submission requires maintainer review and does not create a verified leaderboard entry.
          required: true
        - label: I checked that this public information contains no credentials, private traces or restricted task material.
          required: true
