# Copy this file outside version control and select exact, immutable model IDs.
backend: openai_compatible
api_url: https://api.openai.com/v1/chat/completions
api_key_env: OPENAI_API_KEY
api_key_required: true
main_model: replace-with-exact-model-id
child_model: replace-with-exact-model-id
# Set null for reasoning APIs that do not accept temperature.
temperature: null
max_output_tokens: 16384
max_tokens_parameter: max_completion_tokens
send_seed: true

# Role-separated provider bindings (spec §8). The main agent and the fixed
# child pool resolve provider fields from these mappings; any key omitted from
# a role mapping falls back to the legacy top-level single-provider field above.
# The official Track A profile (deepseek-v4-pro.yaml) declares both explicitly;
# set child_pool_id to one stable id shared across every compared main model.
main_provider:
  backend: openai_compatible
  api_url: https://api.openai.com/v1/chat/completions
  api_key_env: OPENAI_API_KEY
  max_api_concurrency: 4
  max_tokens_parameter: max_completion_tokens
child_provider:
  backend: openai_compatible
  api_url: https://api.openai.com/v1/chat/completions
  api_key_env: OPENAI_API_KEY
  max_api_concurrency: 4
  max_tokens_parameter: max_completion_tokens
child_pool_id: replace-with-stable-child-pool-id

max_main_steps: 100
max_child_steps: 40
max_concurrent_children: 3
max_total_child_spawns: 5
max_api_concurrency: 4
emergency_total_token_cap: 20000000
main_terminal_timeout_sec: 180
child_terminal_timeout_sec: 180
child_timeout_sec: 1200
start_barrier_timeout_sec: 120
live_cancellation_grace_sec: 60
workspace_mode: container_clone
keep_child_workspaces: false
max_tool_output_chars: 20000
request_timeout_sec: 600
