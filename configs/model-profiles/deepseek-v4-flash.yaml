# DeepSeek V4 Flash through the official OpenAI-compatible API.
# The runtime credential is read only from ASYNC_RBENCH_DEEPSEEK_KEY.
backend: openai_compatible
api_url: https://api.deepseek.com/chat/completions
api_key_env: ASYNC_RBENCH_DEEPSEEK_KEY
api_key_required: true
main_model: deepseek-v4-flash
child_model: deepseek-v4-flash

temperature: null
max_output_tokens: 16384
max_tokens_parameter: max_tokens
send_seed: false
request_body_extra: {}

max_main_turns: 100
max_child_turns: 40
max_concurrent_children: 3
max_total_child_spawns: 5
max_api_concurrency: 4
budget_child_shared: 1000000
budget_main_pre: 500000
budget_main_post: 500000
budget_main_total: 1000000
main_terminal_timeout_sec: 180
child_terminal_timeout_sec: 180
child_timeout_sec: 1200
start_barrier_timeout_sec: 120
live_cancellation_grace_sec: 60
workspace_mode: container_clone
keep_child_workspaces: false
max_tool_output_chars: 20000
request_timeout_sec: 600
