# DeepSeek V4 Pro through the official OpenAI-compatible API.
# Credentials are read only from ASYNC_RBENCH_DEEPSEEK_KEY.
backend: openai_compatible
api_url: https://api.deepseek.com/chat/completions
api_key_env: ASYNC_RBENCH_DEEPSEEK_KEY
main_model: deepseek-v4-pro
child_model: deepseek-v4-pro

temperature: null
max_output_tokens: 16384
max_tokens_parameter: max_tokens
send_seed: false
request_body_extra:
  thinking:
    type: enabled
  reasoning_effort: high

# Role-separated provider bindings (spec §8). Official Track A must explicitly
# declare and bind BOTH the main agent and the fixed child pool. The child pool
# is a stable identity shared across every compared main model, so the runner
# can verify the child model/provider/prompt/runtime policy is constant for a group.
main_provider:
  backend: openai_compatible
  api_url: https://api.deepseek.com/chat/completions
  api_key_env: ASYNC_RBENCH_DEEPSEEK_KEY
  max_api_concurrency: 4
  max_tokens_parameter: max_tokens
  request_body_extra:
    thinking:
      type: enabled
    reasoning_effort: high
child_provider:
  backend: openai_compatible
  api_url: https://api.deepseek.com/chat/completions
  api_key_env: ASYNC_RBENCH_DEEPSEEK_KEY
  max_api_concurrency: 4
  max_tokens_parameter: max_tokens
  request_body_extra:
    thinking:
      type: enabled
    reasoning_effort: high
child_pool_id: deepseek-v4-pro-pool

max_main_steps: 100
max_child_steps: 40
max_concurrent_children: 3
max_total_child_spawns: 5
max_api_concurrency: 4
emergency_total_token_cap: 20000000
main_terminal_timeout_sec: 180
child_terminal_timeout_sec: 180
child_timeout_sec: 1200
start_barrier_timeout_sec: 120
live_cancellation_grace_sec: 60
workspace_mode: container_clone
keep_child_workspaces: false
max_tool_output_chars: 20000
request_timeout_sec: 600
