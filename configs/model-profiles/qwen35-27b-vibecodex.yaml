# Qwen3.5-27B via the api.vibecodex.me:3000 relay.
# Credential is read only from QWEN35_27B_API_KEY.
backend: openai_compatible
api_url: https://api.vibecodex.me:3000/v1/chat/completions
api_key_env: QWEN35_27B_API_KEY
api_key_required: true
main_model: qwen3.5-27b
child_model: qwen3.5-27b

temperature: null
max_output_tokens: 16384
max_tokens_parameter: max_tokens
send_seed: false
request_body_extra: {}

max_main_steps: 100
max_child_steps: 40
max_concurrent_children: 3
max_total_child_spawns: 5
max_api_concurrency: 4
emergency_total_token_cap: 5000000
main_terminal_timeout_sec: 180
child_terminal_timeout_sec: 180
child_timeout_sec: 1200
start_barrier_timeout_sec: 120
live_cancellation_grace_sec: 60
workspace_mode: container_clone
keep_child_workspaces: false
max_tool_output_chars: 20000
request_timeout_sec: 600
