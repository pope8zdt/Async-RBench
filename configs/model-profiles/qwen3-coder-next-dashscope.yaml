# Qwen3-Coder-Next through Alibaba Cloud Model Studio's official
# OpenAI-compatible Beijing endpoint. The credential is read only from the
# environment and is never persisted in run artifacts.
backend: openai_compatible
api_url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
api_key_env: DASHSCOPE_API_KEY
api_key_required: true
main_model: qwen3-coder-next
child_model: qwen3-coder-next

temperature: null
max_output_tokens: 16384
max_tokens_parameter: max_tokens
send_seed: false
request_body_extra: {}

max_main_steps: 100
max_child_steps: 40
max_concurrent_children: 3
max_total_child_spawns: 5
max_api_concurrency: 4
emergency_total_token_cap: 20000000
main_terminal_timeout_sec: 180
child_terminal_timeout_sec: 180
child_timeout_sec: 1200
start_barrier_timeout_sec: 120
live_cancellation_grace_sec: 60
workspace_mode: container_clone
keep_child_workspaces: false
max_tool_output_chars: 20000
request_timeout_sec: 600
