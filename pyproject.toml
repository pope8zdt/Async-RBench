[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "async-rbench"
version = "11.0.0"
description = "Benchmark for asynchronous result integration and dynamic replanning"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "requests>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<10", "jsonschema>=4.0", "filelock>=3.0"]

[project.scripts]
async-rbench = "async_rbench.cli:main"
async-rbench-eval = "async_rbench.eval_cli:main"
async-rbench-reference-adapter = "async_rbench.profiles.reference_scaffold_api.adapter:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["async_rbench*"]

[tool.setuptools.package-data]
async_rbench = ["event_taxonomy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -p no:langsmith_plugin"
markers = [
    "docker: opt-in tests that create and remove isolated Docker resources",
]
